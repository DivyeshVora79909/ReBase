[package]
name = "rebase-semantic-proof"
version = "0.15.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Bounded transactional calculation backend with model and developer tools"
default-run = "rebase-next"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
uuid = { version = "=1.23.1", features = ["serde", "v4", "v5"] }
jsonschema = { version = "=0.59.0", default-features = false }
redb = "=4.4.0"
hmac = "=0.12.1"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
base64 = "=0.22.1"
num-bigint = "=0.4.8"
num-integer = "=0.1.47"
num-traits = "=0.2.19"
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }
