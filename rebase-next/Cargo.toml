[package]
name = "rebase-semantic-proof"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Small semantic checks for the isolated ReBase stack redesign"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
uuid = { version = "=1.23.1", features = ["serde", "v4"] }

[dev-dependencies]
jsonschema = { version = "=0.59.0", default-features = false }
redb = "=4.4.0"
