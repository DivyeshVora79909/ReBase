[package]
name = "rebase-semantic-proof"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Isolated local calculation-engine prototype and semantic checks"
default-run = "rebase-next"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
uuid = { version = "=1.23.1", features = ["serde", "v4"] }
jsonschema = { version = "=0.59.0", default-features = false }
redb = "=4.4.0"
hmac = "=0.12.1"
